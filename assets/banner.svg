<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: url(#titleGrad); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    .node-label { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .animated-bg-circle { animation: pulse 6s infinite ease-in-out; }
    .floating-card-1 { animation: float1 5s infinite ease-in-out; }
    .floating-card-2 { animation: float2 6s infinite ease-in-out; }
    .flowing-line { stroke-dasharray: 8, 8; animation: dash 3s linear infinite; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Border -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Dynamic Glowing Background Elements (Placed safely in background) -->
  <circle cx="150" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="animated-bg-circle"/>
  <circle cx="1050" cy="270" r="160" fill="#c084fc" opacity="0.1" filter="url(#glow)" class="animated-bg-circle"/>
  <circle cx="600" cy="180" r="200" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic Lineage / Metadata Grid (Background Layer) -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Flowing Data Connection Lines (Safe lower layer) -->
  <path d="M 150,300 C 350,300 350,320 600,320 C 850,320 950,290 1050,290" fill="none" stroke="url(#lineGrad)" stroke-width="3" class="flowing-line"/>
  <path d="M 100,50 C 300,50 400,30 600,30 C 800,30 900,60 1100,60" fill="none" stroke="url(#lineGrad)" stroke-width="2" class="flowing-line"/>

  <!-- Decorative Dynamic Metric Cards (Side positioned to avoid obscuring center text) -->
  <g class="floating-card-1" transform="translate(60, 240)">
    <rect width="200" height="70" rx="12" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="16" fill="rgba(56, 189, 248, 0.15)"/>
    <path d="M 24,35 L 28,39 L 36,31" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="58" y="32" font-family="sans-serif" font-size="12" fill="#94a3b8" font-weight="600">DATA QUALITY</text>
    <text x="58" y="52" font-family="sans-serif" font-size="16" fill="#f8fafc" font-weight="700">99.8% Verified</text>
  </g>

  <g class="floating-card-2" transform="translate(940, 50)">
    <rect width="200" height="70" rx="12" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="16" fill="rgba(192, 132, 252, 0.15)"/>
    <path d="M 24,35 H 36 M 30,29 V 41" stroke="#c084fc" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="58" y="32" font-family="sans-serif" font-size="12" fill="#94a3b8" font-weight="600">ACTIVE LINEAGE</text>
    <text x="58" y="52" font-family="sans-serif" font-size="16" fill="#f8fafc" font-weight="700">Real-time Graphs</text>
  </g>

  <!-- FOREGROUND CONTENT: Clean, Centered, Perfectly Visible Header Text -->
  <!-- Shield / Governance Icon -->
  <g transform="translate(600, 75)">
    <circle cx="0" cy="0" r="34" fill="url(#cardGrad)" stroke="url(#titleGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Lock / Governance Symbol -->
    <path d="M -10,-4 V -10 A 10,10 0 0,1 10,-10 V -4 M -14,-4 H 14 V 14 A 4,4 0 0,1 10,18 H -10 A 4,4 0 0,1 -14,14 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="7" r="3" fill="#818cf8"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="160" text-anchor="middle" class="title">Awesome Data Governance &amp; Compliance</text>
  <text x="600" y="200" text-anchor="middle" class="subtitle">Curated SaaS Platforms &amp; Open-Source Ecosystem for Metadata, Quality &amp; AI Security</text>

  <!-- Category Pills / Badges in Foreground -->
  <g transform="translate(600, 248)">
    <!-- Pill 1 -->
    <g transform="translate(-250, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" class="badge-text">📊 Data Catalogs</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-85, 0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1"/>
      <text x="85" y="22" text-anchor="middle" class="badge-text">🔍 Active Lineage</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" class="badge-text">🛡️ AI Governance</text>
    </g>
  </g>

</svg>
